#spring.application.name=StudentManagement

spring.application.name=student-management
# Cau hinh file Database SQLite (tu dong tao file student.db tai thu muc goc project)
# spring.datasource.url=jdbc:sqlite:student.db
# spring.datasource.driver-class-name=org.sqlite.JDBC

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/student-management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1410}

# Cau hinh JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true