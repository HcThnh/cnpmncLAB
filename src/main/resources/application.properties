spring.application.name=student-management

# Lấy port tự động từ biến hệ thống, nếu không có thì chạy mặc định 8080
server.port=${PORT:8080}

# Cấu hình Database kết hợp biến môi trường và giá trị mặc định cho local dev
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/student_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect