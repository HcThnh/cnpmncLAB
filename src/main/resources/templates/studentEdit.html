<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh Sửa Sinh Viên</title> <style>
        body { font-family: sans-serif; padding: 20px; }
        .form-container { max-width: 400px; border: 1px solid #ddd; padding: 20px; border-radius: 5px; background-color: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; }
        
        .btn { padding: 8px 15px; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
        .btn-primary { background-color: #ffc107; color: black; } /* Đổi màu nút để phân biệt với Thêm Mới */
        .btn-secondary { background-color: #6c757d; color: white; }
        .actions { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <h1>Chỉnh Sửa Sinh Viên</h1>

    <div class="form-container">
        <form th:action="@{/students/update}" method="post">
            
            <div class="form-group">
                <label for="id">ID Sinh Viên:</label>
                <input type="text" id="id" name="id" th:value="${student.id}" readonly />
            </div>

            <div class="form-group">
                <label for="name">Họ và Tên:</label>
                <input type="text" id="name" name="name" th:value="${student.name}" required />
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" th:value="${student.email}" required />
            </div>

            <div class="form-group">
                <label for="age">Tuổi:</label>
                <input type="number" id="age" name="age" min="1" max="100" th:value="${student.age}" required />
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
                <a th:href="@{/students}" class="btn btn-secondary">Quay Lại</a>
            </div>
        </form>
    </div>

</body>
</html>
