<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${student.id != null and student.id != '' ? 'Cập Nhật Sinh Viên' : 'Thêm Mới Sinh Viên'}">Form Sinh
        Viên</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }

        .btn {
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 3px;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #007BFF;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 th:text="${student.id != null and student.id != '' ? 'Cập Nhật Sinh Viên' : 'Thêm Mới Sinh Viên'}">Form Sinh
            Viên</h2>

        <form th:action="@{/students}" th:object="${student}" method="POST">

            <div class="form-group">
                <label for="id">ID (MSSV):</label>
                <!-- Nếu đang update thì disable ID (bởi vì Id thường ko được sửa), 
                 còn nếu là thêm mới thì cho nhập.
                 Tuy nhiên để Thymeleaf bind được dữ liệu vào model, ID vẫn phải được gửi. -->
                <input type="text" id="id" th:field="*{id}" th:readonly="${student.id != null and student.id != ''}"
                    required />
            </div>

            <div class="form-group">
                <label for="name">Họ và Tên:</label>
                <input type="text" id="name" th:field="*{name}" required />
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" th:field="*{email}" required />
            </div>

            <div class="form-group">
                <label for="age">Tuổi:</label>
                <input type="number" id="age" th:field="*{age}" required />
            </div>

            <div style="margin-top: 20px;">
                <button type="submit" class="btn btn-primary">Lưu</button>
                <a href="/students" class="btn btn-secondary" style="margin-left: 10px;">Hủy</a>
            </div>
        </form>
    </div>

</body>

</html>
