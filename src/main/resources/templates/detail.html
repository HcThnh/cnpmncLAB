<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chi Tiết Sinh Viên</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .row {
            margin-bottom: 10px;
        }

        .label {
            font-weight: bold;
            width: 100px;
            display: inline-block;
        }

        .actions {
            margin-top: 20px;
        }

        .btn {
            padding: 5px 15px;
            text-decoration: none;
            border-radius: 3px;
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-block;
        }

        .btn-primary {
            background-color: #007BFF;
            color: white;
        }

        .btn-danger {
            background-color: #DC3545;
            color: white;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Chi Tiết Sinh Viên</h2>

        <div class="row">
            <span class="label">ID (MSSV):</span>
            <span th:text="${student.id}"></span>
        </div>
        <div class="row">
            <span class="label">Họ và Tên:</span>
            <span th:text="${student.name}"></span>
        </div>
        <div class="row">
            <span class="label">Email:</span>
            <span th:text="${student.email}"></span>
        </div>
        <div class="row">
            <span class="label">Tuổi:</span>
            <span th:text="${student.age}"></span>
        </div>

        <div class="actions">
            <!-- Nút sửa -->
            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-primary">Chỉnh Sửa</a>

            <!-- Nút xóa (phải dùng form để gọi POST request cho an toàn) -->
            <form th:action="@{/students/{id}/delete(id=${student.id})}" method="POST" style="display:inline;"
                onsubmit="return confirm('Bạn có chắc chắn muốn xóa sinh viên này?');">
                <button type="submit" class="btn btn-danger">Xóa</button>
            </form>

            <a href="/students" class="btn btn-secondary" style="margin-left: 10px;">Quay Lại</a>
        </div>
    </div>

</body>

</html>
