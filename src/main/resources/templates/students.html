<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"> <!-- Khai bao namespace de dung th:*-->
<head>
    <meta charset="UTF-8">
    <title>Danh Sach Sinh Vien</title>
    <!-- CSS don gian-->
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<h1>Danh Sach Sinh Vien (SSR)</h1>
<div style="margin-bottom: 20px;">
    <form action="/students" method="GET" style="display: inline-block;">
        <input type="text" name="keyword" placeholder="Nhap ten..." th:value="${param.keyword}" />
        <button type="submit">Tim</button>
    </form>
    <a href="/students/new" style="margin-left: 20px; padding: 5px 10px; background-color: #4CAF50; color: white; text-decoration: none; border-radius: 3px;">Thêm Mới</a>
</div>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Ho va Ten</th>
        <th>Email</th>
        <th>Tuoi</th>
        <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <!-- Cu phap Thymeleaf: Duyet qua danh sach "dsSinhVien"-->
    <!-- th:each="bien_tam : ${key_trong_model}"-->
    <tr th:each="student : ${dsSinhVien}"
        th:class="${student.age < 18} ? 'text-danger' : ''">
        <td th:text="${student.id}">ID</td>
        <td th:text="${student.name}">Name</td>
        <td th:text="${student.email}">Email</td>
        <td th:text="${student.age}">Age</td>
        <td>
            <a th:href="@{/students/{id}(id=${student.id})}">Xem Chi Tiết</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
